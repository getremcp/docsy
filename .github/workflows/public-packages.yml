name: Verify public SDK and CLI
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Build, test and package SDK/CLI
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --workspace @remcp/docsy-sdk --dry-run --json > /tmp/sdk-pack.json
      - run: npm pack --workspace @remcp/docsy-cli --dry-run --json > /tmp/cli-pack.json
      - name: Verify release tag and npm package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const tag=process.env.TAG;
          const match=/^(sdk|cli)-v(\d+\.\d+\.\d+)$/.exec(tag);
          if (!match) throw new Error('Unexpected public release tag: '+tag);
          const pkg=JSON.parse(fs.readFileSync('packages/'+match[1]+'/package.json'));
          if (pkg.version!==match[2]) throw new Error('Release tag and package version differ');
          JS
